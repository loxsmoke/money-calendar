name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # Windows runner: the app is a WinExe with a Windows application manifest, and the
    # headless UI tests render through SkiaSharp against the same stack users run.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MoneyCalendar.slnx

      - name: Build
        run: dotnet build MoneyCalendar.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MoneyCalendar.slnx --configuration Release --no-build --verbosity normal
